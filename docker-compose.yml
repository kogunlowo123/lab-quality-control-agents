# Local development stack: QC service + PostgreSQL + an OIDC provider standing
# in for the enterprise IdP + an OpenTelemetry collector. Uses an in-memory
# audit signing key (LABQC_DEV_EPHEMERAL_AUDIT_KEY); never use this
# configuration outside a developer workstation.
#
# Tokens (client credentials; the Host header keeps the issuer identical to
# the one the service trusts):
#   curl -s -H 'Host: oidc:8080' http://localhost:8081/labqc/token
#        -d grant_type=client_credentials -d client_id=lis-interface
#        -d client_secret=local -d scope=lab-quality-control
#   (one command; shown on three lines)
# client_id lis-interface, qc-technologist or qc-supervisor selects the roles.
name: lab-quality-control-agents

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: labqc
      POSTGRES_USER: labqc
      POSTGRES_PASSWORD: labqc-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labqc -d labqc"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"tokenCallbacks": [{"issuerId": "labqc", "tokenExpiry": 600, "requestMappings": [
        {"requestParam": "client_id", "match": "lis-interface",
         "claims": {"sub": "lis-interface", "aud": ["lab-quality-control"], "roles": ["qc-interface"]}},
        {"requestParam": "client_id", "match": "qc-technologist",
         "claims": {"sub": "tech@lab.local", "name": "Local Technologist",
                    "aud": ["lab-quality-control"], "roles": ["qc-technologist"]}},
        {"requestParam": "client_id", "match": "qc-supervisor",
         "claims": {"sub": "supervisor@lab.local", "name": "Local Supervisor",
                    "aud": ["lab-quality-control"], "roles": ["qc-supervisor"]}}]}]}
    ports:
      - "8081:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  labqc:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      oidc:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      LABQC_ENVIRONMENT: development
      LABQC_DEV_EPHEMERAL_AUDIT_KEY: "true"
      LABQC_PUBLIC_URL: http://localhost:8080
      LABQC_DATABASE_URL: postgresql+asyncpg://labqc:labqc-local-only@postgres:5432/labqc
      LABQC_AUDIT_LOG_PATH: /var/lib/lab-qc/audit/audit.jsonl
      LABQC_OIDC_ISSUER: http://oidc:8080/labqc
      LABQC_OIDC_AUDIENCE: lab-quality-control
      LABQC_OIDC_JWKS_URL: http://oidc:8080/labqc/jwks
      LABQC_AGENT_ID: spiffe://lab.local/agent/lab-qc/qc-agents
      LABQC_SITE_TIMEZONE: UTC
      LABQC_OTLP_ENDPOINT: http://otel-collector:4317
      LABQC_LOG_LEVEL: DEBUG

volumes:
  pgdata:
