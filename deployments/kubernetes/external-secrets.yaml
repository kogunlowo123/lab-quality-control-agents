# Syncs secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud> (Azure Key Vault in the reference deployment).
# Requires the External Secrets Operator and a ClusterSecretStore named
# "platform-secrets" bound to that secret manager. Remote keys match the
# names Terraform creates (database URL) or the platform team uploads
# (audit signing key, model provider settings).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-quality-control-agents-database
  namespace: lab-qc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: lab-quality-control-agents-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: lab-quality-control-agents-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-quality-control-agents-audit-key
  namespace: lab-qc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: lab-quality-control-agents-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^lab-quality-control-agents-audit-key-"
      rewrite:
        - regexp:
            source: "^lab-quality-control-agents-audit-key-(.*)$"
            target: "audit-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-quality-control-agents-model-providers
  namespace: lab-qc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: lab-quality-control-agents-model-providers
    creationPolicy: Owner
  # Key Vault names allow only letters, digits and dashes: a secret named
  # labqc-provider-AZURE-OPENAI-ENDPOINT becomes AZURE_OPENAI_ENDPOINT.
  dataFrom:
    - find:
        name:
          regexp: "^labqc-provider-"
      rewrite:
        - regexp:
            source: "^labqc-provider-"
            target: ""
        - regexp:
            source: "-"
            target: "_"
